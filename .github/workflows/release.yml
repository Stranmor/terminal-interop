name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Verify tag and source
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "terminal-interop-cli") | .version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - run: cargo build --release --locked -p terminal-interop-cli
      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          target=x86_64-unknown-linux-gnu
          archive_root="terminal-interop-${version}-${target}"
          mkdir -p "dist/${archive_root}/bin"
          install -m755 target/release/term-interop "dist/${archive_root}/bin/term-interop"
          install -m755 scripts/zv "dist/${archive_root}/bin/zv"
          install -m644 README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${archive_root}/"
          tar -C dist -czf "dist/${archive_root}.tar.gz" "$archive_root"
          sha256sum "dist/${archive_root}.tar.gz" >"dist/${archive_root}.tar.gz.sha256"
          rm -rf -- "dist/${archive_root}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; refusing to replace assets"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Terminal Interop $GITHUB_REF_NAME"
