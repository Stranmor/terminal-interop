[workspace]
members = [
    "crates/terminal-interop-artifact",
    "crates/terminal-interop-core",
    "crates/terminal-interop-da1",
    "crates/terminal-interop-geometry",
    "crates/terminal-interop-kgp",
    "crates/terminal-interop-ref",
    "crates/terminal-interop-sixel",
    "crates/terminal-interop-tmux",
    "crates/terminal-interop-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
getrandom = "0.3.4"
icy_sixel = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
nix = { version = "0.31.3", features = ["poll", "term"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
