[workspace]
members = [
    "crates/terminal-interop-core",
    "crates/terminal-interop-kgp",
    "crates/terminal-interop-tmux",
    "crates/terminal-interop-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
nix = { version = "0.31.3", features = ["poll", "term"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
